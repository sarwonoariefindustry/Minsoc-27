<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#07130f">
  <title>Mini Soccer — Prototype 0.1</title>
  <link rel="stylesheet" href="./css/style.css">
  <script src="https://cdn.jsdelivr.net/npm/playcanvas@2.24.2/build/playcanvas.min.js"></script>
</head>
<body>
  <main id="game-shell">
    <canvas id="application" aria-label="Mini Soccer 3D game"></canvas>
    <header class="topbar">
      <div class="brand"><span class="brand-mark">M</span><span>MINI SOCCER <small>PROTOTYPE 0.1</small></span></div>
      <div class="status"><span class="live-dot"></span> TRAINING ARENA</div>
    </header>
    <section class="hud">
      <div class="score"><span>HOME</span><strong id="score">0 — 0</strong><span>AWAY</span></div>
      <div class="hint" id="hint">Gerakkan pemain untuk mendekati bola</div>
    </section>
    <div class="controls">
      <div class="move-zone">
        <div id="joystick" class="joystick"><div id="stick" class="stick"></div></div>
        <span class="control-caption">MOVE</span>
      </div>
      <div class="action-zone">
        <button id="sprint" class="action secondary">SPRINT</button>
        <button id="kick" class="action primary">KICK</button>
      </div>
    </div>
    <button id="reset" class="reset">RESET BALL</button>
    <div id="loading" class="loading">Memuat arena 3D…</div>
  </main>
  <script type="module" src="./js/main.js"></script>
</body>
</html>
