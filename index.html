<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <title>Mini Soccer 3D — Prototype 0.1</title>
  <link rel="stylesheet" href="./css/style.css" />
  <script type="importmap">
    {
      "imports": {
        "playcanvas": "https://cdn.jsdelivr.net/npm/playcanvas@2.3.2/+esm"
      }
    }
  </script>
</head>
<body>
  <div id="game-wrapper">
    <canvas id="application-canvas"></canvas>

    <header id="hud-top" aria-label="Status Pertandingan">
      <div class="hud-pill">
        <span class="hud-label">GOL</span>
        <span id="goal-count" class="hud-value">0</span>
      </div>
      <div class="hud-pill">
        <span class="hud-label">TENDANGAN</span>
        <span id="shot-count" class="hud-value">0</span>
      </div>
      <button id="btn-reset" class="hud-btn" type="button" aria-label="Reset Posisi">
        RESET
      </button>
    </header>

    <div id="goal-banner" class="hidden" role="status" aria-live="polite">
      <span>GOL!</span>
    </div>

    <div id="status-toast" class="hidden" role="status"></div>

    <div id="touch-controls" aria-label="Kontrol Sentuh">
      <div id="joystick-zone" aria-label="Joystick Gerak">
        <div id="joystick-base">
          <div id="joystick-knob"></div>
        </div>
      </div>

      <div id="action-zone">
        <button id="btn-sprint" class="action-btn" type="button" aria-label="Sprint">
          SPRINT
        </button>
        <button id="btn-shoot" class="action-btn primary" type="button" aria-label="Tendang">
          TENDANG
        </button>
      </div>
    </div>
  </div>

  <script type="module" src="./js/main.js"></script>
</body>
</html>
