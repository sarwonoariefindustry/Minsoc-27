
<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#07130f">
  <title>Mini Soccer — Prototype 0.9</title>
  <link rel="stylesheet" href="./css/style.css">

  <script type="importmap">
    {
      "imports": {
        "playcanvas": "https://cdn.jsdelivr.net/npm/playcanvas@2.24.2/build/playcanvas.mjs"
      }
    }
  </script>
</head>
<body>
  <main id="game-shell">
    <canvas id="application" aria-label="Mini Soccer 3D game"></canvas>

    <header class="topbar">
      <div class="brand">
        <span class="brand-mark">M</span>
        <span>MINI SOCCER <small>PROTOTYPE 0.9</small></span>
      </div>

      <div class="status">
        <span class="live-dot"></span> MATCH MODE
      </div>
    </header>

    <section class="hud">
      <div class="scoreboard">
        <div class="team-label home-label">HOME</div>
        <strong id="home-score">0</strong>
        <span class="score-divider">—</span>
        <strong id="away-score">0</strong>
        <div class="team-label away-label">AWAY</div>
      </div>

      <div class="match-clock" id="match-clock">02:00</div>

      <div class="hint" id="hint">
        Joystick kiri: bergerak | Geser kanan: kamera
      </div>
    </section>

    <div class="controls">
      <div class="move-zone">
        <div id="joystick" class="joystick">
          <div id="stick" class="stick"></div>
        </div>
        <span class="control-caption">MOVE</span>
      </div>

      <div class="action-zone">
        <button id="through" class="action through">THROUGH</button>
        <button id="shoot" class="action shoot">SHOOT</button>
        <button id="pass" class="action pass">PASS</button>
        <button id="sprint" class="action sprint">SPRINT</button>
      </div>
    </div>

    <div id="match-overlay" class="match-overlay hidden">
      <div class="match-panel">
        <div id="match-message" class="match-message">GOAL!</div>
        <div id="match-submessage" class="match-submessage">
          Kick-off sebentar lagi
        </div>
        <button id="restart-match" class="restart-match hidden">
          RESTART MATCH
        </button>
      </div>
    </div>

    <div id="loading" class="loading">
      Memuat arena 3D…
    </div>
  </main>

  <script type="module" src="./js/main.js"></script>
</body>
</html>
